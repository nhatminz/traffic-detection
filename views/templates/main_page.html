<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
  // Unified script: creates charts and updates them periodically.
  (function () {
    let classLabelChart = null;
    let vehicleTimeChart = null;
    let roadOccupancyChart = null;
    const REFRESH_MS = 5000;
    let intervalId = null;

    // Convert raw rows (array of objects) into the structured object the UI expects
    function aggregateRows(rows) {
      const classCounts = {};
      const timeCounts = {};
      const roadOccupancy = {};

      if (!Array.isArray(rows)) return { classLabels: {keys:[], values:[]}, timeData:{keys:[], values:[]}, roadOccupancy:{keys:[], values:[]} };

      rows.forEach(row => {
        try {
          const ts = row.Timestamp;
          // handle different timestamp formats: ISO string or epoch (s or ms)
          let dateObj = null;
          if (typeof ts === 'number') {
            // heuristics: if > 1e12 assume ms, else seconds
            dateObj = new Date(ts > 1e12 ? ts : ts * 1000);
          } else {
            dateObj = new Date(ts);
            if (isNaN(dateObj.getTime()) && /^\d+$/.test(ts)) {
              const n = Number(ts);
              dateObj = new Date(n > 1e12 ? n : n * 1000);
            }
          }

          const timeKey = isNaN(dateObj.getTime())
            ? String(ts)
            : `${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

          const label = row['Class Name'] || row.className || 'Unknown';
          const width = parseFloat(row.Width || row.width || 0) || 0;
          const height = parseFloat(row.Height || row.height || 0) || 0;

          classCounts[label] = (classCounts[label] || 0) + 1;
          timeCounts[timeKey] = (timeCounts[timeKey] || 0) + 1;
          const area = (width * height) / 1_000_000; // m^2
          roadOccupancy[label] = (roadOccupancy[label] || 0) + area;
        } catch (e) {
          // ignore malformed rows
          console.warn('Malformed row in aggregateRows', e, row);
        }
      });

      // Keep time keys sorted chronologically (by HH:MM if possible)
      const timeEntries = Object.entries(timeCounts).sort((a,b) => {
        // try parse "HH:MM"
        const toMinutes = s => {
          const m = s.match(/^(\d{1,2}):(\d{2})$/);
          return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
        };
        return toMinutes(a[0]) - toMinutes(b[0]);
      });

      return {
        classLabels: { keys: Object.keys(classCounts), values: Object.values(classCounts) },
        timeData: { keys: timeEntries.map(e => e[0]), values: timeEntries.map(e => e[1]) },
        roadOccupancy: { keys: Object.keys(roadOccupancy), values: Object.values(roadOccupancy) }
      };
    }

    function createChartsFromAggregated(agg) {
    
      const labelColor = getCurrentLabelColor();

      // Pie chart
      console.log("chuẩn bị tạo chart 1");
      classLabelChart = new Chart(document.getElementById('classLabelChart'), {
        type: 'pie',
        data: {
          labels: agg.classLabels.keys,
          datasets: [{
            label: 'Category Distribution of Vehicles',
            data: agg.classLabels.values,
            backgroundColor: [
              '#FF7F00','#FF0000','#FF1493','#0000FF','#00FF00','#FFFF00','#00FFFF','#FF6347','#FFD700','#FF69B4','#00FF7F','#8A2BE2'
            ]
          }]
        },
        options: {
          plugins: {
            legend: { position: 'top', labels: { color: labelColor } },
            datalabels: { color: labelColor, formatter: (val, ctx) => `${ctx.chart.data.labels[ctx.dataIndex]}: ${val}` }
          }
        },
        plugins: [ChartDataLabels]
      });

      // Line chart (vehicle count over time)
      console.log("chuẩn bị tạo chart 2");
      vehicleTimeChart = new Chart(document.getElementById('vehicleTimeChart'), {
        type: 'line',
        data: {
          labels: agg.timeData.keys.slice(-10),
          datasets: [{
            label: 'Number of Vehicles over time',
            data: agg.timeData.values.slice(-10),
            borderColor: 'rgba(5,59,252,1)',
            backgroundColor: 'rgba(5,59,252,0.3)',
            fill: true,
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            x: { ticks: { color: labelColor }, title: { display: true, text: 'Time', color: labelColor } },
            y: { ticks: { color: labelColor }, title: { display: true, text: 'Count', color: labelColor } }
          },
          plugins: {
            legend: { labels: { color: labelColor } }
          },
          responsive: true,
          maintainAspectRatio: false
        }
      });

      // Bar chart (road occupancy)
      console.log("chuẩn bị tạo chart 3");
      roadOccupancyChart = new Chart(document.getElementById('roadOccupancyChart'), {
        type: 'bar',
        data: {
          labels: agg.roadOccupancy.keys,
          datasets: [{
            label: 'Road Occupancy by all Vehicles (m²)',
            data: agg.roadOccupancy.values,
            backgroundColor: 'rgba(255,13,37,0.5)',
            borderColor: 'rgba(255,13,37,1)',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            x: { ticks: { color: labelColor }, title: { display: true, text: 'Vehicles', color: labelColor } },
            y: { beginAtZero: true, ticks: { color: labelColor }, title: { display: true, text: 'Area (m²)', color: labelColor } }
          },
          plugins: {
            legend: { labels: { color: labelColor } }
          },
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    function updateChartsFromAggregated(agg) {
      if (!classLabelChart || !vehicleTimeChart || !roadOccupancyChart) {
        createChartsFromAggregated(agg);
        return;
      }
      classLabelChart.data.labels = agg.classLabels.keys;
      classLabelChart.data.datasets[0].data = agg.classLabels.values;
      classLabelChart.update();

      vehicleTimeChart.data.labels = agg.timeData.keys.slice(-10);
      vehicleTimeChart.data.datasets[0].data = agg.timeData.values.slice(-10);
      vehicleTimeChart.update();

      roadOccupancyChart.data.labels = agg.roadOccupancy.keys;
      roadOccupancyChart.data.datasets[0].data = agg.roadOccupancy.values;
      roadOccupancyChart.update();
    }

    // Generic handler for server response: may be already aggregated or raw rows or {rawData: rows}
    function handleServerData(resp) {
      if (!resp) return;
      if (resp.classLabels && resp.timeData && resp.roadOccupancy) {
        updateChartsFromAggregated(resp);
      } else if (Array.isArray(resp)) {
        updateChartsFromAggregated(aggregateRows(resp));
      } else if (resp.rawData && Array.isArray(resp.rawData)) {
        updateChartsFromAggregated(aggregateRows(resp.rawData));
      } else {
        console.warn('Unknown /get_chart_data response shape, trying to aggregate raw properties if present', resp);
        // try to find array inside object
        const candidate = Object.values(resp).find(v => Array.isArray(v));
        if (candidate) updateChartsFromAggregated(aggregateRows(candidate));
      }
    }

    // Initial fetch and periodic updates
    function startFetching() {
      // initial fetch
      fetch('/get_chart_data')
        .then(r => r.json())
        .then(handleServerData)
        .catch(err => console.error('Error fetching initial chart data:', err));

      // periodic updates
      intervalId = setInterval(() => {
        fetch('/get_chart_data')
          .then(r => r.json())
          .then(handleServerData)
          .catch(err => console.error('Error fetching chart data (interval):', err));
      }, REFRESH_MS);
    }

    // cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (intervalId) clearInterval(intervalId);
    });

    // start
    console.log("before fetching")
    startFetching();
  })();
  </script>
