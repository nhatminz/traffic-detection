<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Vision Dashboard</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16x16.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_page.css') }}">
</head>
<body>
    <header>
      <div class="head">
            <div class="datedisplay">
                <div id="date">Loading</div>
                <div id="time">Loading</div>
            </div>
        <div class="head-content">
        <h1 class="stylishtext">Traffic Analysis and Assessment</h1>
        <div class="buttons">
        <div class="subbuttons">
        <div class="tooltip-container">
            <img 
              class="eyebutton" 
              id="eyebutton" 
              style="width: 30px; height: 30px;" 
              src="{{ url_for('static', filename='images/eyeopen.png') }}" 
              alt="eye"
            >
            <span class="tooltip-text1">Detection Visibility On</span>
          </div>
          
          <!-- Database Button -->
          <div class="tooltip-container">
            <a 
              href="https://docs.google.com/spreadsheets/d/12vTS7-9aQg4QnU5s0d2Oo2mQfohEVVQEfqEtm2EaL7Y/edit?gid=0#gid=0" 
              class="databasebutton" 
              target="_blank"
            >
              <img 
                style="width: 30px; height: 30px;" 
                src="{{ url_for('static', filename='images/database.png') }}" 
                alt="Table"
              >
            </a>
            <span class="tooltip-text">Open Database</span>
          </div>
        </div>
          <!-- Toggle Button -->
          <div class="tooltip-container">
            <div class="togglebutton"></div>
            <span class="tooltip-text2">Light Mode</span>
          </div>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
        
        <!-- LEFT SIDE -->
        <div class="left-side">

            <!-- Video section -->
            <div class="video-box">
                <h3>Video Stream</h3>
                <div class="video-content">
                    <div id="videoloader" class="videoloader" style="display: none;"></div>
                    <img src="{{ url_for('video.video_feed') }}" alt="Live Traffic Stream" id="videoStream">
                </div>
            </div>

            <!-- Traffic analysis -->
            <div class="traffic-box">
                <h3>Traffic Analysis</h3>
                <div class="traffic-content">
                    <!-- Bạn sẽ thêm thông tin sau -->
                </div>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right-side">
            <h3>Charts</h3>
            <div class="chart-content">
                <!-- Khung biểu đồ để trống -->
            </div>
        </div>

    </div>

</body>
</html>
